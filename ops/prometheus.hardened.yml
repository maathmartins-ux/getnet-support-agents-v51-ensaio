# Prometheus do overlay endurecido (docker-compose.hardened.yml): o ops/prometheus.yml mais o Bearer do /metrics.
# Em produção a API exige METRICS_TOKEN (src/app/api.py, production_gaps); o token chega como segredo do compose
# (/run/secrets/metrics_token, do mesmo METRICS_TOKEN do .env) e nunca fica neste arquivo. Mudou o ops/prometheus.yml?
# Mude aqui também: tests/test_supply_chain.py::test_hardened_prometheus_scrapes_with_the_metrics_token compara os dois.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: app
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    dns_sd_configs:
      - names: ["api", "api-pg"]
        type: A
        port: 8000
        refresh_interval: 15s
    relabel_configs:
      # qual serviço (api | api-pg) além do IP:porta da réplica em `instance`
      - source_labels: [__meta_dns_name]
        target_label: service
